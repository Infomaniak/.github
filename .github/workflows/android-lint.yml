name: Android Lint

on: workflow_call

permissions:
  contents: read

jobs:
  lint:
    runs-on: [ self-hosted, Android ]

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6.0.3
        with:
          token: ${{ github.token }}
          submodules: recursive

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          # Runs on a self-hosted runner whose disk (and ~/.gradle) already persists between
          # runs, so the actions/cache-based network cache only adds a slow upload/download
          # round-trip for no benefit. Disable it and rely on the runner's local cache instead.
          cache-disabled: true

      - name: Run lint
        run: ./gradlew lint
