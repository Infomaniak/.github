# https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions
#
# Reusable workflow to purge Android/Maven snapshots older than a given age from
# a Reposilite "snapshots" repository, since nothing tells us if/when a snapshot
# stops being used. Not tied to Kotlin Multiplatform: usable by any project
# (Android-only or KMP) publishing snapshots to Reposilite. See
# kmp-cleanup-ios-snapshots.yml for the iOS/GitHub-release equivalent, used
# only by KMP repos.
name: Cleanup Reposilite snapshots

on:
  workflow_call:
    inputs:
      max-age-days:
        description: 'Delete snapshots older than this many days'
        required: false
        type: number
        default: 15
      maven-group-path:
        description: 'Group path of the artifact(s) in the Reposilite "snapshots" repository (e.g. com/infomaniak/designsystem)'
        required: true
        type: string
      maven-repository-url:
        description: 'Base URL of the Reposilite instance'
        required: false
        type: string
        default: 'https://maven.infomaniak.app'
      maven-snapshots-repository:
        description: 'Name of the Reposilite repository hosting snapshots'
        required: false
        type: string
        default: 'snapshots'
    secrets:
      REPOSILITE_USERNAME:
        required: true
      REPOSILITE_PASSWORD:
        required: true

jobs:
  cleanup-snapshots:
    name: Cleanup old snapshots
    runs-on: [ self-hosted, Android ]
    steps:
      - name: Delete Reposilite snapshot versions older than max-age-days
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -v-"${{ inputs.max-age-days }}"d +%s 2>/dev/null || date -u -d "-${{ inputs.max-age-days }} days" +%s)
          BASE_URL="${{ inputs.maven-repository-url }}/api/maven/details/${{ inputs.maven-snapshots-repository }}/${{ inputs.maven-group-path }}"

          # "maven-group-path" only points at the group (e.g. com/infomaniak/designsystem):
          # each directory found there is an artifact ID (e.g. CalendarCore), and the actual
          # versions to inspect/delete live one level below, under each artifact.
          curl -s -u "${REPOSILITE_USERNAME}:${REPOSILITE_PASSWORD}" "$BASE_URL" \
            | jq -r '.files[]? | select(.type == "DIRECTORY") | .name' \
            | while IFS= read -r ARTIFACT; do
                curl -s -u "${REPOSILITE_USERNAME}:${REPOSILITE_PASSWORD}" "$BASE_URL/$ARTIFACT" \
                  | jq -r '.files[]? | select(.type == "DIRECTORY") | .name' \
                  | while IFS= read -r VERSION; do
                      LAST_MODIFIED=$(curl -s -u "${REPOSILITE_USERNAME}:${REPOSILITE_PASSWORD}" "$BASE_URL/$ARTIFACT/$VERSION" | jq -r '.lastModifiedTime // empty')
                      if [ -z "$LAST_MODIFIED" ]; then
                        continue
                      fi
                      MODIFIED_TS=$(( $(echo "$LAST_MODIFIED" | cut -c1-10) ))
                      if [ "$MODIFIED_TS" -lt "$CUTOFF" ]; then
                        echo "Deleting expired snapshot version: $ARTIFACT/$VERSION (last modified $(date -u -d "@$MODIFIED_TS" 2>/dev/null || date -j -f %s "$MODIFIED_TS"))"
                        curl -s -X DELETE -u "${REPOSILITE_USERNAME}:${REPOSILITE_PASSWORD}" "${{ inputs.maven-repository-url }}/${{ inputs.maven-snapshots-repository }}/${{ inputs.maven-group-path }}/$ARTIFACT/$VERSION" || true
                      fi
                    done
              done
        env:
          REPOSILITE_USERNAME: ${{ secrets.REPOSILITE_USERNAME }}
          REPOSILITE_PASSWORD: ${{ secrets.REPOSILITE_PASSWORD }}
