# https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions
#
# Reusable workflow shared across Kotlin Multiplatform repos to purge iOS
# snapshots older than a given age, since nothing tells us if/when a snapshot
# stops being used. Deletes GitHub prereleases and orphaned snapshot tags, plus
# their matching SPM branches, when they are older than `max-age-days`.
#
# For the Android/Maven side, KMP repos should call
# cleanup-reposilite-snapshots.yml directly (in addition to this workflow),
# since that one isn't tied to Kotlin Multiplatform and is also used by
# Android-only projects (e.g. android-design-system).
name: Cleanup KMP iOS snapshots

on:
  workflow_call:
    inputs:
      max-age-days:
        description: 'Delete snapshots older than this many days'
        required: false
        type: number
        default: 15

jobs:
  cleanup-ios-snapshots:
    name: Cleanup old iOS snapshots
    runs-on: [ self-hosted, Android ]
    permissions:
      contents: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@v6.0.3

      - name: Setup gh CLI
        run: command -v gh >/dev/null 2>&1 || brew install gh

      - name: Delete iOS snapshot releases, tags and branches older than max-age-days
        run: |
          set -euo pipefail
          TEMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TEMP_DIR"' EXIT

          # Compute the cutoff Unix timestamp: anything created before this is expired.
          # macOS's `date -v` is tried first (self-hosted runner), falling back to GNU `date -d`.
          CUTOFF=$(date -u -v-"${{ inputs.max-age-days }}"d +%s 2>/dev/null || date -u -d "-${{ inputs.max-age-days }} days" +%s)

          delete_matching_branch() {
            TAG=$1
            BRANCH="spm-${TAG}"
            if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
              echo "Deleting matching branch: $BRANCH"
              git push origin --delete "$BRANCH"
            fi
          }

          tag_timestamp() {
            TAG=$1
            STAMP=
            if [[ "$TAG" =~ -([0-9]{14})$ ]]; then
              STAMP=${BASH_REMATCH[1]}
              NORMALIZED="${STAMP:0:4}-${STAMP:4:2}-${STAMP:6:2}T${STAMP:8:2}:${STAMP:10:2}:${STAMP:12:2}Z"
            elif [[ "$TAG" =~ -([0-9]{12})(-[0-9]+-[0-9]+)?$ ]]; then
              STAMP=${BASH_REMATCH[1]}
              NORMALIZED="${STAMP:0:4}-${STAMP:4:2}-${STAMP:6:2}T${STAMP:8:2}:${STAMP:10:2}:00Z"
            else
              return 1
            fi

            date -j -u -f "%Y-%m-%dT%H:%M:%SZ" "$NORMALIZED" +%s 2>/dev/null \
              || date -u -d "$NORMALIZED" +%s 2>/dev/null
          }

          ref_timestamp() {
            TAG=$1
            git fetch --quiet --no-tags origin "refs/tags/$TAG"
            git log -1 --format=%ct FETCH_HEAD
          }

          gh release list --json tagName,isPrerelease,createdAt --limit 1000 > "$TEMP_DIR/releases.json"
          jq -r '.[] | select(
              .isPrerelease
              and (.tagName == "ios-snapshot" or (.tagName | startswith("ios-snapshot-")))
            ) | [.tagName, .createdAt] | @tsv' \
            "$TEMP_DIR/releases.json" > "$TEMP_DIR/prereleases"
          jq -r '.[].tagName' "$TEMP_DIR/releases.json" > "$TEMP_DIR/release-tags"

          while IFS=$'\t' read -r TAG CREATED_AT; do
            CREATED_TS=$(date -u -d "$CREATED_AT" +%s 2>/dev/null || date -j -u -f "%Y-%m-%dT%H:%M:%SZ" "$CREATED_AT" +%s)
            if [ "$CREATED_TS" -lt "$CUTOFF" ]; then
              echo "Deleting expired release/tag: $TAG (created $CREATED_AT)"
              gh release delete "$TAG" --yes --cleanup-tag
              delete_matching_branch "$TAG"
            fi
          done < "$TEMP_DIR/prereleases"

          git ls-remote --tags origin "refs/tags/ios-snapshot*" \
            | awk '$2 !~ /\^\{\}$/ { sub("refs/tags/", "", $2); print $2 }' \
            | awk '$0 == "ios-snapshot" || /^ios-snapshot-/' > "$TEMP_DIR/snapshot-tags"

          while IFS= read -r TAG; do
            if grep -Fqx "$TAG" "$TEMP_DIR/release-tags"; then
              continue
            fi

            if TAG_TS=$(tag_timestamp "$TAG"); then
              AGE_SOURCE="timestamp encoded in tag"
            else
              TAG_TS=$(ref_timestamp "$TAG")
              AGE_SOURCE="tag target commit date"
            fi

            if [ "$TAG_TS" -lt "$CUTOFF" ]; then
              echo "Deleting expired orphan tag: $TAG ($AGE_SOURCE)"
              git push origin --delete "refs/tags/$TAG"
              delete_matching_branch "$TAG"
            fi
          done < "$TEMP_DIR/snapshot-tags"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
