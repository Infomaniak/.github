name: Periphery

on:
  workflow_call:
    inputs:
      setup_step:
        required: false
        type: string
        default: 'echo "Nothing to do"'

jobs:
  periphery:
    runs-on: [ self-hosted, iOS ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654
        with:
          cache: false
      - name: Setup Step
        run: ${{ inputs.setup_step }}
      - name: Generate
        run: tuist install && tuist generate
      - name: Periphery
        run: periphery scan --retain-codable-properties --format github-actions --relative-results --strict
