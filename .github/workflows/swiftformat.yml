name: SwiftFormat

on: workflow_call

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654
        with:
          cache: false
      - name: SwiftFormat
        run: swiftformat --lint . --reporter github-actions-log
